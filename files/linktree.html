<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#12101a" />
  <title>Link-tree</title>
  <style>
    :root {
      --page: #252421;
      --card: #181817;
      --card-hover: #302c28;
      --text: #f2f0eb;
      --muted: #c7c0b8;
      --accent: #c89583;
      --accent-2: #e2b2a1;
      --border: rgba(200, 149, 131, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page);
    }

    .page {
      width: min(100% - 2rem, 42rem);
      margin: 0 auto;
      padding: 3.5rem 0 2rem;
      text-align: center;
    }

    .profile { margin-bottom: 2rem; }

    .avatar {
      display: grid;
      place-items: center;
      width: 5.75rem;
      height: 5.75rem;
      margin: 0 auto 1rem;
      border: 2px solid var(--accent);
      border-radius: 50%;
      background: #171716;
      box-shadow: 0 0 0 6px rgba(200, 149, 131, 0.09), 0 1.25rem 2.5rem rgba(0, 0, 0, 0.22);
      color: var(--accent-2);
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.08em;
    }

    h1 { margin: 0; font-size: clamp(1.65rem, 5vw, 2.2rem); letter-spacing: -0.045em; }
    .bio { max-width: 32rem; margin: 0.65rem auto 0; color: var(--muted); line-height: 1.55; }

    .links { display: grid; gap: 0.85rem; }

    .link-card {
      position: relative;
      display: grid;
      grid-template-columns: 2.25rem minmax(0, 1fr) 2.25rem;
      align-items: center;
      min-height: 4.3rem;
      padding: 0.6rem 1rem;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 1.15rem;
      background: var(--card);
      box-shadow: 0 0.6rem 1.5rem rgba(0, 0, 0, 0.16);
      color: var(--text);
      text-decoration: none;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .link-card::before {
      position: absolute;
      inset: 0;
      content: "";
      opacity: 0;
      background: linear-gradient(105deg, rgba(226, 178, 161, 0.14), transparent 44%);
      transition: opacity 180ms ease;
    }

    .link-card:hover, .link-card:focus-visible {
      transform: translateY(-3px) scale(1.01);
      border-color: var(--accent-2);
      background: var(--card-hover);
      outline: none;
    }

    .link-card:hover::before, .link-card:focus-visible::before { opacity: 1; }
    .link-icon, .arrow, .link-title { position: relative; z-index: 1; }
    .link-icon { font-size: 1.45rem; line-height: 1; }
    .link-title { font-weight: 700; letter-spacing: -0.015em; }
    .arrow { color: var(--muted); font-size: 1.35rem; }

    footer { margin-top: 2.1rem; color: var(--muted); font-size: 0.8rem; }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--text); }

    @media (max-width: 420px) {
      .page { width: min(100% - 1.25rem, 42rem); padding-top: 2.4rem; }
      .link-card { min-height: 4rem; border-radius: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="profile" aria-labelledby="profile-name">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <h1 id="profile-name"></h1>
      <p class="bio" id="bio"></p>
    </section>

    <nav class="links" id="links" aria-label="Social and project links"></nav>

    <footer><a id="footer-link" href="#"></a></footer>
  </main>

  <script>
    // -------- EDIT THIS CONFIGURATION --------
    // Add, remove, or modify items in the `links` array to customize the page.
    const profile = {
      name: "Vito Scaraggi",
      bio: "PhD student, IIT-CNR associate",
      initials: "VS",
      footer: ""
    };

    const links = [
	  { title: "Paper - 'Towards Neurosymbolic Network Intrusion Detection'", url: "https://ieeexplore.ieee.org/abstract/document/11627550", icon: "🖹" },
	  { title: "Code - 'Towards Neurosymbolic Network Intrusion Detection'", url: "https://github.com/devitoska/nesy_nids", icon: "🖳" },
      { title: "My Website", url: "https://vitoscaraggi.com", icon: "⌂" },
      { title: "Connect on LinkedIn", url: "https://www.linkedin.com/in/vitoscaraggi", icon: "in" }
    ];
    // ----------------------------------------

    const avatar = document.getElementById("avatar");
    const name = document.getElementById("profile-name");
    const bio = document.getElementById("bio");
    const container = document.getElementById("links");
    const footer = document.getElementById("footer-link");

    document.title = `${profile.name} | Links`;
    avatar.textContent = profile.initials || profile.name.split(/\s+/).map(word => word[0]).join("").slice(0, 2);
    name.textContent = profile.name;
    bio.textContent = profile.bio;
    footer.textContent = profile.footer;

    links.forEach(({ title, url, icon = "↗" }) => {
      const link = document.createElement("a");
      link.className = "link-card";
      link.href = url;
      link.target = url.startsWith("http") ? "_blank" : "_self";
      link.rel = url.startsWith("http") ? "noopener noreferrer" : "";
      link.setAttribute("aria-label", title);
      link.innerHTML = `
        <span class="link-icon" aria-hidden="true">${icon}</span>
        <span class="link-title">${title}</span>
        <span class="arrow" aria-hidden="true">›</span>
      `;
      container.appendChild(link);
    });
  </script>
</body>
</html>
